name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and install library
        run: ./mvnw -B install

      - name: Generate test report
        if: success() || failure()
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          python3 .github/scripts/test_report.py --version "$version" --out target/test-report
          cat target/test-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build demo
        run: ../mvnw -B -DskipTests package
        working-directory: criteria-filter-demo

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/test-report/
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
