spring:
  datasource:
    url: jdbc:h2:mem:criteria-filter;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

criteria-filter:
  base-packages:
    - dev.agiro.criteriafilter.sample

logging:
  level:
    dev.agiro.criteriafilter: DEBUG
