spring:
  application:
    name: criteria-filter-demo

  # PostgreSQL database
  datasource:
    url: jdbc:postgresql://localhost:5432/criteriafilter
    driver-class-name: org.postgresql.Driver
    username: demo
    password: secret

  # JPA/Hibernate settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Server settings
server:
  port: 8080

# Criteria Filter settings
criteria-filter:
  base-packages:
    - dev.agiro.demo.entity
  default-date-time-pattern: "yyyy-MM-dd'T'HH:mm:ss"

# Swagger/OpenAPI settings
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    dev.agiro.demo: DEBUG
    dev.agiro.criteriafilter: DEBUG
    org.hibernate.SQL: DEBUG
